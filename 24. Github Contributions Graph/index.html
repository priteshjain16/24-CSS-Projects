<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 24</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <main class="graph-wrapper">
    <h1 class="graph-title">Contribution Graph</h1>

    <!-- The JS fills this element with .cell divs -->
    <div
      class="graph"
      id="graph"
      role="img"
      aria-label="Randomly generated contribution graph">
    </div>

    <!-- Optional: re-roll without refreshing -->
    <button class="reroll-btn" id="rerollBtn" type="button">
      Re-roll colours
    </button>
  </main>

  <script src="Script.js"></script>
</body>
</html>
